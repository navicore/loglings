# loglings exercise registry.
#
# Each entry:
#   name = short identifier (used by `loglings hint <name>` etc.)
#   path = path relative to the project root
#   mode = "parse" (file must parse) or "test" (hidden `test/0` must succeed)
#
# Default mode is "test".

