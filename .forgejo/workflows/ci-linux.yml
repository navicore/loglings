name: CI - Linux

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

# This workflow ONLY calls `just` commands. The justfile is the source
# of truth for all build/test/lint logic, preventing drift between
# local development and CI.
#
# `runs-on: navicore-rust` targets the custom job image at
# git.navicore.tech/navicore/navicore-forgejo-runner:latest, which has
# Rust 1.95.0, clang-19, and just pre-installed. The Rust version there
# MUST stay in sync with rust-toolchain.toml at the repo root; clang (>= 15)
# is what `plgc` uses to link each compiled exercise.

jobs:
  ci-linux:
    name: CI - Linux x86_64
    runs-on: navicore-rust

    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Verify toolchain
      run: |
        rustc --version
        cargo --version
        cargo clippy --version
        clang --version
        just --version

    - name: Cache cargo registry
      uses: actions/cache@v5
      with:
        path: ~/.cargo/registry
        key: linux-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

    - name: Cache cargo index
      uses: actions/cache@v5
      with:
        path: ~/.cargo/git
        key: linux-cargo-git-${{ hashFiles('**/Cargo.lock') }}

    # NOTE: target/ is intentionally NOT cached. Stale compiled test
    # binaries can cause false failures when language semantics change.

    # The curriculum tests (tests/curriculum.rs) compile every exercise/solution
    # with `plgc`, so it must be on PATH. patch-prolog2 is not on crates.io yet
    # (deliberate — it'll publish once the system matures), so install from git,
    # pinned to a rev for reproducible CI; bump deliberately. plgc links each
    # compiled exercise with clang, already in the runner image.
    - name: Install plgc compiler (patch-prolog2, git rev-pinned)
      run: |
        cargo install --git https://git.navicore.tech/navicore/patch-prolog2.git \
          plg-compiler --rev 2e5f8ba --locked --force
        plgc --version

    - name: Run CI checks (just ci)
      run: just ci
